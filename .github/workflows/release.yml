name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Split per ABI APKs
        run: flutter build apk --split-per-abi

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/LoveSync-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/LoveSync-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/LoveSync-armeabi-v7a.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name || 'v1.0.0' }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name || 'v1.0.0' }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/LoveSync-universal.apk
            release-assets/LoveSync-arm64-v8a.apk
            release-assets/LoveSync-armeabi-v7a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
